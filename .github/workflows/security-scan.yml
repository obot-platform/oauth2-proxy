name: Security Scan

# Kept separate from ci.yml so upstream merges don't conflict with it.
# Unlike the report-only Trivy step in ci.yml, these jobs fail the build.
on:
  push:
    branches:
      - obot
  pull_request:
    branches:
      - '**'
  schedule: # New advisories land without code changes, so scan daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Get Go version
      run: |
        version=$(grep "^go " go.mod | cut -d' ' -f2 | cut -d. -f1,2)
        echo "version=${version}" >> "$GITHUB_OUTPUT"
      id: go-version

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true

    # Fails only on vulnerabilities reachable from our code.
    - name: Run govulncheck
      run: |
        go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavour: [distroless, alpine]
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build image
      run: |
        args=(REGISTRY=local REPOSITORY=oauth2-proxy VERSION=scan)
        if [ "${{ matrix.flavour }}" = "alpine" ]; then
          # Read the image from the Makefile so the scan always matches what we ship.
          alpine_image=$(sed -n 's/^DOCKER_BUILD_RUNTIME_IMAGE_ALPINE *?= *//p' Makefile)
          args+=("DOCKER_BUILD_RUNTIME_IMAGE=${alpine_image}")
        fi
        make build-docker-local "${args[@]}"

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'image'
        image-ref: 'local/oauth2-proxy:scan-local'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        hide-progress: true
        format: 'table'
        exit-code: '1'
